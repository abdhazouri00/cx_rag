services:
  app:
    build:
      context: ./src
    container_name: cx_rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MSSQL_HOST=mssql
      - MSSQL_PORT=1433
      - VECTOR_DB_URL=http://qdrant:6333
    volumes:
      - app_files:/app/assets/files
    depends_on:
      mssql:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cx_rag-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://app:8000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  app_files:
  mssql_data:
  qdrant_data:
